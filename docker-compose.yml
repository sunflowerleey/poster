version: '3.8'

services:
  # HTML存储服务
  html-storage:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: html-storage-service
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # 持久化HTML存储
      - html_storage_data:/app/html_storage
      # 持久化日志
      - logs_data:/app/logs
    networks:
      - html-storage-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: html-storage-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - html-storage
    networks:
      - html-storage-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# 持久化卷
volumes:
  html_storage_data:
    driver: local
  logs_data:
    driver: local
  nginx_cache:
    driver: local

# 网络配置
networks:
  html-storage-network:
    driver: bridge
