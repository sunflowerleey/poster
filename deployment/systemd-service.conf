# Systemd服务配置文件
# 如果不使用PM2，可以使用systemd直接管理Node.js应用
#
# 安装方法:
# sudo cp deployment/systemd-service.conf /etc/systemd/system/html-storage.service
# sudo systemctl daemon-reload
# sudo systemctl enable html-storage
# sudo systemctl start html-storage

[Unit]
Description=HTML Storage Service
Documentation=https://github.com/your-repo/poster
After=network.target

[Service]
Type=simple
User=htmlapp
WorkingDirectory=/home/htmlapp/apps/html-storage-service
Environment="NODE_ENV=production"
Environment="PORT=3000"

# 启动命令
ExecStart=/usr/bin/node server.js

# 重启策略
Restart=on-failure
RestartSec=10s

# 资源限制
LimitNOFILE=65536
MemoryLimit=512M

# 日志
StandardOutput=append:/home/htmlapp/apps/html-storage-service/logs/out.log
StandardError=append:/home/htmlapp/apps/html-storage-service/logs/error.log
SyslogIdentifier=html-storage

# 安全设置
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/home/htmlapp/apps/html-storage-service

[Install]
WantedBy=multi-user.target
